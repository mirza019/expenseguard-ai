[project]
name = "fincontext-ai"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
description = "Local-first financial intelligence, governed context, and autonomous workflows"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.coverage.run]
source = ["app.services", "app.tools", "app.agents", "app.workflows", "app.database", "app.reports", "app.rag", "app.evaluation"]

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
