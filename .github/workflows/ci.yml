name: Quality checks
on:
  push:
    branches: [main, 'feature/**', 'docs/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    env:
      LANGCHAIN_TRACING_V2: 'false'
      LANGSMITH_TRACING: 'false'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bash -n start.sh
      - run: python scripts/check_environment.py
      - run: python -c "import app.main; import app.agents.graph; import app.services.model_manager; import app.reports.pdf_generator"
      - run: node --check site/app.mjs
      - run: node --test tests/frontend/report.test.mjs
      - run: python scripts/build_pages_demo.py
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest --cov --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-python-${{ matrix.python-version }}
          path: coverage.xml
